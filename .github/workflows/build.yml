name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      # Build archs sequentially so jobs don't race to create the same tag's
      # GitHub release (softprops/action-gh-release "already_exists").
      max-parallel: 1
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            exe_asset: rust-terminal.exe
          # TODO: re-enable ARM64 builds later.
          # - target: aarch64-pc-windows-msvc
          #   exe_asset: rust-terminal-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --bin rust-terminal --target ${{ matrix.target }}

      # Keep the asset name the PEBakery script expects (rust-terminal.exe /
      # rust-terminal-arm64.exe).
      - name: Stage asset
        shell: pwsh
        run: Copy-Item "target/${{ matrix.target }}/release/rust-terminal.exe" "${{ matrix.exe_asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.exe_asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.exe_asset }}
          generate_release_notes: true
