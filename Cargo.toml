# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "rust-terminal"
version = "0.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "GDI-rendered terminal emulator for Windows PE (no DWM/D3D/XAML)"

# Main GUI binary is src/main.rs (default). The ConPTY feasibility spike is a
# separate self-contained throwaway binary.
[[bin]]
name = "rust-terminal"
path = "src/main.rs"

[[bin]]
name = "conpty-spike"
path = "src/bin/conpty_spike.rs"

# Size-tuned to match the sibling start-pe app: tiny, dependency-light binaries.
[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1

[dependencies]
vte = "0.13"            # ANSI/VT state machine (alacritty's parser)
unicode-width = "0.1"   # correct wide-character (CJK) cell layout
winreg = "0.55"         # registry config + shared StartPE accent (matches start-pe)

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Dwm",          # DwmSetWindowAttribute: remove the Win11 window border
    "Win32_System_Console",        # ConPTY: CreatePseudoConsole / ResizePseudoConsole / ClosePseudoConsole / HPCON
    "Win32_System_Threading",      # CreateProcessW, STARTUPINFOEXW, proc-thread attribute list
    "Win32_System_Pipes",          # CreatePipe
    "Win32_Storage_FileSystem",    # ReadFile / WriteFile
    "Win32_System_IO",             # ReadFile / WriteFile live here in windows 0.58
    "Win32_System_LibraryLoader",  # GetModuleHandleW
    "Win32_Graphics_Gdi",          # GDI: fonts, DCs, BitBlt, text out
    "Win32_UI_WindowsAndMessaging", # CreateWindowExW, message loop, wndproc
    "Win32_UI_Input_KeyboardAndMouse", # key input
    "Win32_UI_HiDpi",              # SetProcessDpiAwarenessContext
    "Win32_System_DataExchange",   # clipboard (Open/Close/Get/SetClipboardData)
    "Win32_System_Memory",         # GlobalAlloc/Lock for clipboard buffers
    "Win32_System_Ole",            # CF_UNICODETEXT
]
